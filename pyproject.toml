[project]
name = "inbox-to-order"
version = "0.1.0"
description = "A proof of concept: read order emails (Gmail or demo files), let Claude propose the order, have a person confirm it, and write it to a demo ERP - all through MCP."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Levixflow" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.4.0,<3",
    "fastapi>=0.115",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.1",
    "google-auth-oauthlib>=1.5.0",
    "mcp>=2.3.0,<3",
    "pydantic>=2.14.2",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.32",
]

[project.scripts]
inbox-to-order = "inbox_to_order.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13,<2",
    "playwright>=1.48",
    "pytest>=8",
    "ruff>=0.8,<0.9",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires real credentials (Gmail or Anthropic); skipped by default"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
# `ruff format` wraps the code at 120; a few long messages and SQL statements stay on one line.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
