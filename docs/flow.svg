<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-label="The app sits between the mailbox and the ERP. It reads the mailbox through a read-only Mail MCP server, Claude reads each email and proposes the order, a person confirms, and only then does the app write to the ERP through the ERP MCP server.">
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b1f33"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff5a1f"/>
    </marker>
    <marker id="arrow-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fb3c8"/>
    </marker>
  </defs>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="1200" height="430" rx="24" fill="#ffffff"/>

    <!-- Mailbox -->
    <rect x="30" y="160" width="200" height="120" rx="16" fill="#ffffff" stroke="#d5dce4" stroke-width="2"/>
    <rect x="110" y="180" width="40" height="28" rx="4" fill="none" stroke="#0b1f33" stroke-width="2.5"/>
    <polyline points="110,182 130,198 150,182" fill="none" stroke="#0b1f33" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="130" y="236" text-anchor="middle" font-size="20" font-weight="700" fill="#0b1f33">Mailbox</text>
    <text x="130" y="260" text-anchor="middle" font-size="14" fill="#66778a">Gmail or demo emails</text>
    <circle cx="70" cy="318" r="13" fill="#ff5a1f"/>
    <text x="70" y="323" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
    <text x="92" y="324" font-size="16" font-weight="600" fill="#0b1f33">Email arrives</text>

    <!-- Link 1: mailbox to Mail MCP server to app (read-only) -->
    <line x1="230" y1="220" x2="266" y2="220" stroke="#0b1f33" stroke-width="2.5"/>
    <line x1="354" y1="220" x2="396" y2="220" stroke="#0b1f33" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <circle cx="310" cy="220" r="44" fill="#ffffff" stroke="#0b1f33" stroke-width="2.5"/>
    <text x="310" y="227" text-anchor="middle" font-size="19" font-weight="800" fill="#0b1f33">MCP</text>
    <text x="310" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#0b1f33">Mail server</text>
    <text x="310" y="306" text-anchor="middle" font-size="13" fill="#66778a">read-only</text>

    <!-- Claude -->
    <rect x="402" y="20" width="200" height="56" rx="14" fill="#ffffff" stroke="#d5dce4" stroke-width="2"/>
    <text x="502" y="46" text-anchor="middle" font-size="18" font-weight="700" fill="#0b1f33">Claude</text>
    <text x="502" y="65" text-anchor="middle" font-size="13" fill="#66778a">Anthropic API</text>

    <!-- The app -->
    <rect x="400" y="130" width="400" height="180" rx="20" fill="#0b1f33"/>
    <text x="640" y="166" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">Inbox to Order</text>
    <text x="640" y="188" text-anchor="middle" font-size="13" fill="#9fb3c8">the app, on your computer</text>
    <line x1="502" y1="78" x2="502" y2="206" stroke="#9fb3c8" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#arrow-light)" marker-end="url(#arrow-light)"/>

    <rect x="420" y="210" width="165" height="76" rx="12" fill="#17375a"/>
    <circle cx="444" cy="236" r="12" fill="#ff5a1f"/>
    <text x="444" y="241" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
    <text x="464" y="242" font-size="16" font-weight="700" fill="#ffffff">AI reads it</text>
    <text x="436" y="270" font-size="13" fill="#c4d2df">proposes the order</text>

    <line x1="587" y1="248" x2="611" y2="248" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow-light)"/>

    <rect x="615" y="210" width="165" height="76" rx="12" fill="#17375a"/>
    <circle cx="639" cy="236" r="12" fill="#ff5a1f"/>
    <text x="639" y="241" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
    <text x="659" y="242" font-size="16" font-weight="700" fill="#ffffff">You confirm</text>
    <text x="631" y="270" font-size="13" fill="#c4d2df">or correct it first</text>

    <!-- Link 2: app to ERP MCP server to ERP (writes, only after confirmation) -->
    <line x1="800" y1="220" x2="846" y2="220" stroke="#ff5a1f" stroke-width="3"/>
    <line x1="934" y1="220" x2="966" y2="220" stroke="#ff5a1f" stroke-width="3" marker-end="url(#arrow-orange)"/>
    <circle cx="890" cy="220" r="44" fill="#ffffff" stroke="#ff5a1f" stroke-width="3"/>
    <text x="890" y="227" text-anchor="middle" font-size="19" font-weight="800" fill="#0b1f33">MCP</text>
    <text x="890" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#0b1f33">ERP server</text>
    <text x="890" y="306" text-anchor="middle" font-size="13" fill="#d83e0b">writes only after</text>
    <text x="890" y="322" text-anchor="middle" font-size="13" fill="#d83e0b">you confirm</text>

    <!-- ERP -->
    <rect x="970" y="160" width="200" height="120" rx="16" fill="#ffffff" stroke="#d5dce4" stroke-width="2"/>
    <ellipse cx="1070" cy="184" rx="20" ry="6" fill="none" stroke="#0b1f33" stroke-width="2.5"/>
    <path d="M1050,184 V204 A20,6 0 0 0 1090,204 V184" fill="none" stroke="#0b1f33" stroke-width="2.5"/>
    <text x="1070" y="236" text-anchor="middle" font-size="20" font-weight="700" fill="#0b1f33">ERP</text>
    <text x="1070" y="260" text-anchor="middle" font-size="14" fill="#66778a">Demo ERP in this repo</text>
    <circle cx="1006" cy="318" r="13" fill="#ff5a1f"/>
    <text x="1006" y="323" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
    <text x="1028" y="324" font-size="16" font-weight="600" fill="#0b1f33">ERP updated</text>

    <text x="600" y="398" text-anchor="middle" font-size="14" fill="#66778a">MCP is the open standard the app uses to talk to the mailbox and to the ERP: swap a server, keep the app.</text>
  </g>
</svg>
